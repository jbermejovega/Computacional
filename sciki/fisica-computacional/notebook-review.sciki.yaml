      kind: notebook
      path: obligatorios/obligatorio4/Obligatorio4.ipynb
    - id: VOLUNTARIO_1_GALAXY_FORMATION
      kind: notebook
      path: Voluntarios/Voluntario1/notebook.ipynb
  edges:
    - from: FISICA_COMPUTACIONAL_NOTEBOOK_REVIEW_WORKFLOW
      relation: validates
      to: MCP_SCIKI_N8N_FISICA_COMPUTACIONAL_REVIEW_RESOURCE_V1
    - from: NOTEBOOK_DEEP_REVIEW_SCRIPT
      relation: emits_witness_for
      to: REVISION_PROFUNDA_NOTEBOOKS_V1
    - from: OBLIGATORIO_2_ISING_EMPTY_SHADOW
      relation: blocks_review_until_deleted_or_restored
      to: OBLIGATORIO_2_ISING_CANONICAL_REPORT
    - from: OBLIGATORIO_4_THREE_BODY_ROOT_COPY
      relation: duplicates_or_shadows
      to: OBLIGATORIO_4_THREE_BODY_CANONICAL_CANDIDATE
    - from: N8N_FISICA_COMPUTACIONAL_DEEP_REVIEW
      relation: orchestrates_manual_review
      to: REVISION_PROFUNDA_NOTEBOOKS_V1
  review_states:
    BLOCKED:
      meaning: file cannot be reviewed as a valid notebook artifact
      canonical_action: delete_restore_or_replace
    NEEDS_REVISION:
      meaning: notebook is parseable but has reproducibility or structure issues
      canonical_action: revise_before_final_grading
    READY_FOR_CONTENT_REVIEW:
      meaning: static structure is clean enough for physics/content grading
      canonical_action: continue_to_scientific_review
