    - id: NOTEBOOK_DEEP_REVIEW_SCRIPT
      kind: static_reviewer
      path: scripts/revision_fisica_computacional/notebook_deep_review.py
    - id: FISICA_COMPUTACIONAL_NOTEBOOK_REVIEW_WORKFLOW
      kind: github_actions_invariant_workflow
      path: .github/workflows/fisica-computacional-notebook-review.yml
    - id: N8N_FISICA_COMPUTACIONAL_DEEP_REVIEW
      kind: n8n_export
      path: n8n/fisica-computacional-deep-review.workflow.json
    - id: OBLIGATORIO_1_VERLET_SOLAR_SYSTEM
      kind: notebook
      path: obligatorios/obligatorio1/sistemas_solar_notebook.ipynb
    - id: OBLIGATORIO_2_ISING_EMPTY_SHADOW
      kind: blocked_notebook
      path: obligatorios/obligatorio2/Informe _ising.ipynb
    - id: OBLIGATORIO_2_ISING_CANONICAL_REPORT
      kind: notebook
      path: obligatorios/obligatorio2/Obligatorio2_informe.ipynb
    - id: OBLIGATORIO_4_THREE_BODY_ROOT_COPY
      kind: duplicate_notebook_candidate
      path: Obligatorio4.ipynb
