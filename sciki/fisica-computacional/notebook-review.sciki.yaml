SCI_KI_FISICA_COMPUTACIONAL_NOTEBOOK_REVIEW_V1:
  marker: FISICA_COMPUTACIONAL_DEEP_NOTEBOOK_REVIEW_V1
  resource: MCP_SCIKI_N8N_FISICA_COMPUTACIONAL_REVIEW_RESOURCE_V1
  status: active
  repository: jbermejovega/Computacional
  knowledge_mode: notebook_by_notebook_deep_review
  invariants:
    no_notebook_code_execution: true
    read_only_static_review: true
    replay_safe: true
    generated_witness_required: true
  nodes:
    - id: REVISION_PROFUNDA_NOTEBOOKS_V1
      kind: human_review_report
